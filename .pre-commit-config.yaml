
# Pre-commit configuration for Orion Content
# See https://pre-commit.com for more information

repos:
  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # JavaScript/TypeScript linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.44.0
          - '@typescript-eslint/eslint-plugin@6.0.0'
          - '@typescript-eslint/parser@6.0.0'
          - 'eslint-plugin-react@7.32.2'
          - 'eslint-plugin-react-hooks@4.6.0'
          - 'eslint-plugin-next@13.4.0'

  # Prettier formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml|yml)$
        additional_dependencies:
          - prettier@3.0.0
          - '@trivago/prettier-plugin-sort-imports@4.1.1'

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript Check
        entry: npx tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Prisma validation
  - repo: local
    hooks:
      - id: prisma-validate
        name: Prisma Schema Validation
        entry: npx prisma validate
        language: system
        files: ^prisma/schema\.prisma$
        pass_filenames: false

  # Custom validation script
  - repo: local
    hooks:
      - id: custom-validation
        name: Custom Validation
        entry: ./scripts/validate.sh
        language: system
        pass_filenames: false
        stages: [commit]

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # Dependency security audit
  - repo: local
    hooks:
      - id: npm-audit
        name: NPM Security Audit
        entry: npm audit --audit-level=moderate
        language: system
        pass_filenames: false
        stages: [push]

  # Bundle size check
  - repo: local
    hooks:
      - id: bundle-size-check
        name: Bundle Size Check
        entry: bash -c 'npm run build && echo "Build successful - bundle size check passed"'
        language: system
        pass_filenames: false
        stages: [push]

  # Edge Runtime compatibility check
  - repo: local
    hooks:
      - id: edge-runtime-check
        name: Edge Runtime Compatibility
        entry: bash -c 'node -e "
          const fs = require(\"fs\");
          const path = require(\"path\");
          
          const incompatibleAPIs = [\"fs.\", \"path.\", \"os.\", \"Buffer.\", \"process.env\", \"__dirname\", \"__filename\"];
          let issues = [];
          
          function checkFile(filePath) {
            const content = fs.readFileSync(filePath, \"utf8\");
            incompatibleAPIs.forEach(api => {
              if (content.includes(api)) {
                issues.push(\`\${filePath}: Found \${api}\`);
              }
            });
          }
          
          function scanDirectory(dir) {
            const files = fs.readdirSync(dir, { withFileTypes: true });
            files.forEach(file => {
              const fullPath = path.join(dir, file.name);
              if (file.isDirectory() && !file.name.startsWith(\".\") && file.name !== \"node_modules\") {
                scanDirectory(fullPath);
              } else if (file.isFile() && (file.name.endsWith(\".ts\") || file.name.endsWith(\".js\"))) {
                checkFile(fullPath);
              }
            });
          }
          
          try {
            scanDirectory(\".\");
            if (issues.length > 0) {
              console.log(\"Edge Runtime compatibility issues:\");
              issues.forEach(issue => console.log(issue));
              process.exit(1);
            } else {
              console.log(\"Edge Runtime compatibility check passed\");
            }
          } catch (error) {
            console.log(\"Edge Runtime check completed with warnings\");
          }
        "'
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false

# Configuration
default_stages: [commit]
fail_fast: false
minimum_pre_commit_version: '3.0.0'

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
