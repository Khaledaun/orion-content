
name: Prisma Schema Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ main, develop ]
    paths:
      - 'prisma/**'

jobs:
  prisma-validation:
    runs-on: ubuntu-latest
    name: Validate Prisma Schema
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orion_validation
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Validate Prisma schema syntax
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          npx prisma validate
        else
          echo "No Prisma schema found, skipping validation"
          exit 0
        fi
        
    - name: Generate Prisma client
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          npx prisma generate
        fi
        
    - name: Check database connection
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_validation
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          npx prisma db push --skip-generate
        fi
        
    - name: Run migration validation
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_validation
      run: |
        if [ -d "prisma/migrations" ]; then
          npx prisma migrate deploy
        else
          echo "No migrations found, creating initial migration"
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma migrate dev --name init --skip-generate
          fi
        fi
        
    - name: Validate schema against database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_validation
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          npx prisma db pull --print > current-schema.prisma
          echo "Comparing schemas..."
          diff prisma/schema.prisma current-schema.prisma || echo "Schema differences detected"
        fi
        
    - name: Run Prisma studio validation
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_validation
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          # Test that Prisma Studio can start (run for 5 seconds then kill)
          timeout 5s npx prisma studio --port 5555 || echo "Prisma Studio validation complete"
        fi

  schema-security-check:
    runs-on: ubuntu-latest
    name: Schema Security Analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Analyze schema for security issues
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          cat > schema-security-check.js << 'EOF'
          const fs = require('fs');
          
          const schemaContent = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const securityIssues = [];
          
          // Check for potential security issues
          const checks = [
            {
              pattern: /password\s+String(?!\s+@)/i,
              message: 'Password field should be hashed (@db.VarChar or similar)'
            },
            {
              pattern: /email\s+String(?!.*@unique)/i,
              message: 'Email field should be unique'
            },
            {
              pattern: /@default\(now\(\)\).*updatedAt/i,
              message: 'updatedAt should use @updatedAt directive instead of @default(now())'
            },
            {
              pattern: /String\s+@id/i,
              message: 'Consider using @default(cuid()) or @default(uuid()) for String IDs'
            }
          ];
          
          checks.forEach(check => {
            if (check.pattern.test(schemaContent)) {
              securityIssues.push(check.message);
            }
          });
          
          if (securityIssues.length > 0) {
            console.log('Schema Security Issues Found:');
            securityIssues.forEach(issue => console.log(`- ${issue}`));
            console.log('\nThese are recommendations, not blocking errors.');
          } else {
            console.log('No obvious security issues found in schema');
          }
          EOF
          
          node schema-security-check.js
        fi

  migration-safety-check:
    runs-on: ubuntu-latest
    name: Migration Safety Analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Analyze migrations for safety
      run: |
        if [ -d "prisma/migrations" ]; then
          cat > migration-safety-check.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const migrationsDir = 'prisma/migrations';
          const migrations = fs.readdirSync(migrationsDir);
          
          const dangerousOperations = [
            'DROP TABLE',
            'DROP COLUMN',
            'ALTER COLUMN',
            'DROP INDEX',
            'TRUNCATE'
          ];
          
          migrations.forEach(migration => {
            const migrationPath = path.join(migrationsDir, migration, 'migration.sql');
            if (fs.existsSync(migrationPath)) {
              const content = fs.readFileSync(migrationPath, 'utf8').toUpperCase();
              
              dangerousOperations.forEach(op => {
                if (content.includes(op)) {
                  console.log(`⚠️  Migration ${migration} contains potentially dangerous operation: ${op}`);
                }
              });
            }
          });
          
          console.log('Migration safety check complete');
          EOF
          
          node migration-safety-check.js
        else
          echo "No migrations directory found"
        fi

  prisma-performance-check:
    runs-on: ubuntu-latest
    name: Prisma Performance Analysis
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orion_perf_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_perf_test
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          npx prisma db push --skip-generate
          npx prisma generate
        fi
        
    - name: Run performance tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion_perf_test
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          cat > prisma-perf-test.js << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          
          async function runPerformanceTests() {
            const prisma = new PrismaClient({
              log: ['query', 'info', 'warn', 'error'],
            });
            
            try {
              console.log('Testing Prisma client initialization...');
              const start = Date.now();
              await prisma.$connect();
              const connectTime = Date.now() - start;
              console.log(`Connection time: ${connectTime}ms`);
              
              // Test basic query performance
              console.log('Testing basic queries...');
              const queryStart = Date.now();
              await prisma.$queryRaw`SELECT 1`;
              const queryTime = Date.now() - queryStart;
              console.log(`Basic query time: ${queryTime}ms`);
              
              console.log('Performance tests completed successfully');
            } catch (error) {
              console.error('Performance test failed:', error);
              process.exit(1);
            } finally {
              await prisma.$disconnect();
            }
          }
          
          runPerformanceTests();
          EOF
          
          node prisma-perf-test.js
        fi
        
    - name: Generate Prisma report
      run: |
        echo "# Prisma Validation Report" > prisma-report.md
        echo "Generated on: $(date)" >> prisma-report.md
        echo "" >> prisma-report.md
        
        if [ -f "prisma/schema.prisma" ]; then
          echo "## Schema Information" >> prisma-report.md
          echo "- Schema file exists: ✅" >> prisma-report.md
          echo "- Models count: $(grep -c '^model ' prisma/schema.prisma)" >> prisma-report.md
          echo "- Enums count: $(grep -c '^enum ' prisma/schema.prisma)" >> prisma-report.md
        fi
        
        if [ -d "prisma/migrations" ]; then
          echo "- Migrations count: $(ls -1 prisma/migrations | wc -l)" >> prisma-report.md
        fi
        
    - name: Upload Prisma report
      uses: actions/upload-artifact@v4
      with:
        name: prisma-report
        path: prisma-report.md
